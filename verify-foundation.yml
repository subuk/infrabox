---
- name: Verify implemented host foundation
  hosts: infrabox
  become: true
  tasks:
    - name: Run component verification
      ansible.builtin.include_role:
        name: '{{ infrabox_verify_component }}'
        tasks_from: verify
      loop: [chrony, selinux, firewalld, podman, tpm2_pkcs11]
      loop_control:
        loop_var: infrabox_verify_component

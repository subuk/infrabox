---
nginx_package: nginx-1.26.3-6.el10_2.6
nginx_landing_root: /usr/share/nginx/html/infrabox
nginx_upstreams:
  - {name: ldap, address: 'http://127.0.0.1:17170'}
  - {name: git, address: 'http://127.0.0.1:3000'}
  - {name: netbox, address: 'http://127.0.0.1:8080'}
  - {name: grafana, address: 'http://127.0.0.1:3001'}
  - {name: vault, address: 'https://127.0.0.1:8200'}
  - name: claw
    hostname: '{{ openclaw_hostname | default("claw." ~ infrabox_domain) }}'
    address: 'http://127.0.0.1:{{ openclaw_port | default(18789) }}'

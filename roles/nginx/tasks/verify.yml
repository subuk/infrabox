---
- name: Verify nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Verify InfraBox home page
  ansible.builtin.import_tasks: verify-landing.yml
  tags: [nginx_landing]
- name: Verify trusted OpenBao public HTTPS route
  ansible.builtin.uri:
    url: 'https://vault.{{ infrabox_domain }}/v1/sys/health'
  register: nginx_openbao_health
- name: Verify trusted Gitea public HTTPS route
  ansible.builtin.uri:
    url: 'https://git.{{ infrabox_domain }}/api/healthz'
- name: Verify trusted NetBox public HTTPS route
  ansible.builtin.uri:
    url: 'https://netbox.{{ infrabox_domain }}/login/'
- name: Verify trusted OpenClaw HTTPS liveness and readiness
  ansible.builtin.uri:
    url: 'https://{{ openclaw_hostname | default("claw." ~ infrabox_domain) }}/{{ item }}'
  loop: [healthz, readyz]
  when: nginx_verify_openclaw | default(true) | bool

---
- name: Create host-only NetBox management helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/infrabox
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install NetBox-owned OpenClaw provisioning code
  ansible.builtin.copy:
    src: openclaw-integration.py
    dest: /usr/local/libexec/infrabox/netbox-openclaw-integration.py
    owner: root
    group: root
    mode: '0700'
- name: Reconcile dedicated NetBox identity, permissions, and starter vocabulary
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - -i
      - --workdir
      - /opt/netbox/netbox
      - netbox
      - /opt/netbox/venv/bin/python
      - -c
      - |
        import os, json, sys, django, contextlib, io
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'netbox.settings')
        with contextlib.redirect_stdout(io.StringIO()):
            django.setup()
        data = json.load(sys.stdin)
        exec(data['code'], {'config': data['config']})
    stdin: '{{ netbox_openclaw_request | to_json }}'
  vars:
    netbox_openclaw_request:
      code: '{{ lookup("ansible.builtin.file", role_path ~ "/files/openclaw-integration.py") }}'
      config:
        action: reconcile
        username: '{{ netbox_openclaw_username }}'
        permission_name: '{{ netbox_openclaw_permission_name }}'
  register: netbox_openclaw_reconcile
  changed_when: netbox_openclaw_reconcile.rc == 0 and (netbox_openclaw_reconcile.stdout | from_json).changed

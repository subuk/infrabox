---
- name: Inspect pinned image
  ansible.builtin.command:
    argv: [podman, image, exists, '{{ redis_image }}']
  changed_when: false
  failed_when: redis_image_exists.rc not in [0, 1]
  register: redis_image_exists
- name: Pull pinned image when absent
  ansible.builtin.command:
    argv: [podman, pull, '{{ redis_image }}']
  changed_when: true
  when: redis_image_exists.rc != 0

---
- name: Apply gitea Quadlet
  ansible.builtin.include_role:
    name: quadlet
    tasks_from: service
  vars:
    quadlet_name: gitea
- name: Apply gitea configuration changes
  ansible.builtin.meta: flush_handlers
- name: Wait for Gitea health
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/healthz
  register: gitea_health
  until: gitea_health.status == 200
  retries: 40
  delay: 3
- name: Install native Gitea identity configuration helper
  ansible.builtin.copy:
    src: identity.py
    dest: '{{ infrabox_config_root }}/identity/gitea-configure.py'
    owner: root
    group: root
    mode: '0700'
- name: Configure central Gitea authentication
  ansible.builtin.command:
    argv: [python3, '{{ infrabox_config_root }}/identity/gitea-configure.py']
    stdin: '{{ gitea_identity_parameters | to_json }}'
  vars:
    gitea_identity_parameters:
      uid: '{{ gitea_uid }}'
      url: 'https://git.{{ infrabox_domain }}'
      ca: '{{ infrabox_root_ca_path }}'
      admin_user: '{{ gitea_identity_admin_username }}'
      admin_password: '{{ lldap_admin_password }}'
      ldap_host: 'lldap.{{ infrabox_internal_domain }}'
      base_dn: '{{ identity_directory_base_dn | default("dc=infrabox,dc=internal") }}'
      reader_password: '{{ lldap_reader_password }}'
      organizations: '{{ identity_gitea_organizations | default([platform_organization | default("infrabox-platform")]) }}'
      clients_file: '{{ infrabox_config_root }}/identity/clients.json'
      issuer: 'https://vault.{{ infrabox_domain }}/v1/identity/oidc/provider/infrabox'
  register: gitea_identity_configuration
  changed_when: gitea_identity_configuration.rc == 0 and (gitea_identity_configuration.stdout | from_json).changed
  failed_when: false
  no_log: true
- name: Report sanitized Gitea authentication failure
  ansible.builtin.fail:
    msg: '{{ gitea_identity_configuration.stderr }}'
  when: gitea_identity_configuration.rc != 0

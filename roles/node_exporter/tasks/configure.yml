---
- name: Discover private monitoring network
  ansible.builtin.command:
    argv: [podman, network, inspect, infrabox]
  register: node_exporter_network
  changed_when: false
- name: Select private monitoring address
  ansible.builtin.set_fact:
    node_exporter_address: '{{ (node_exporter_network.stdout | from_json)[0].subnets[0].gateway }}'
    node_exporter_subnet: '{{ (node_exporter_network.stdout | from_json)[0].subnets[0].subnet }}'
- name: Create atomic textfile directory
  ansible.builtin.file:
    path: /var/lib/infrabox-node-exporter
    state: directory
    owner: root
    group: infrabox-node-exporter
    mode: '0750'
- name: Permit only backend metrics traffic
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ node_exporter_subnet }}" destination address="{{ node_exporter_address }}" port port="9100" protocol="tcp" accept'
    state: enabled
    permanent: true
    immediate: true
- name: Configure restricted native exporter service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/infrabox-node-exporter.service
    mode: '0644'
  register: node_exporter_unit

---
- name: Validate Quadlet definition
  ansible.builtin.assert:
    that:
      - quadlet_name is match('^[a-z][a-z0-9_-]+$')
      - quadlet_type in ['container', 'network']
      - quadlet_definition is string
- name: Create Quadlet directory
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: '0755'
- name: Render Quadlet definition
  ansible.builtin.copy:
    content: '{{ quadlet_definition }}'
    dest: '/etc/containers/systemd/{{ quadlet_name }}.{{ quadlet_type }}'
    mode: '0644'
  register: quadlet_rendered

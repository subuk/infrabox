---
- name: Create monitoring implementation and private state directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    mode: '{{ item.mode }}'
  loop:
    - {path: /usr/local/libexec/infrabox-monitoring, mode: '0755'}
    - {path: /var/lib/infrabox-monitoring, mode: '0700'}
    - {path: /var/lib/infrabox-monitoring-public, mode: '0755'}
    - {path: '{{ infrabox_config_root }}/monitoring', mode: '0755'}
    - {path: '{{ infrabox_config_root }}/monitoring/staged', mode: '0755'}
    - {path: '{{ infrabox_config_root }}/monitoring/secrets', mode: '0700'}
- name: Install fixed monitoring implementations
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/libexec/infrabox-monitoring/{{ item }}'
    mode: '0755'
  loop: [configure.py, worker.py, health.py, provision.py, netbox-probe.py, canary.yml]
  register: integration_checks_code

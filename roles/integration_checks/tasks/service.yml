---
- name: Apply monitoring units
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: '{{ (integration_checks_units.changed | default(false)) }}'
    enabled: true
    state: '{{ "restarted" if (integration_checks_units.changed | default(false)) or (item == "infrabox-health.service" and (integration_checks_code.changed | default(false))) else "started" }}'
  loop: [infrabox-checks.timer, infrabox-canary.timer, infrabox-health.service]

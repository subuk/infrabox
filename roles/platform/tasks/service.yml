---
- name: Apply Platform runner Quadlet
  ansible.builtin.include_role:
    name: quadlet
    tasks_from: service
  vars:
    quadlet_name: platform-runner
    quadlet_type: container
- name: Restart after changed credentials or execution configuration
  ansible.builtin.systemd_service:
    name: platform-runner.service
    state: restarted
  when: platform_management_changed | bool or platform_runner_config.changed or platform_trust.changed
- name: Activate native token self-renewal
  ansible.builtin.systemd_service:
    name: platform-token-renew.timer
    daemon_reload: '{{ platform_renew_units.changed }}'
    enabled: true
    state: started
- name: Verify deployed runtime and resume the runner
  ansible.builtin.include_tasks: manage.yml
  vars:
    platform_action: finalize

---
- name: Inspect pinned image
  ansible.builtin.command:
    argv: [podman, image, exists, '{{ postgresql_image }}']
  changed_when: false
  failed_when: postgresql_image_exists.rc not in [0, 1]
  register: postgresql_image_exists
- name: Pull pinned image when absent
  ansible.builtin.command:
    argv: [podman, pull, '{{ postgresql_image }}']
  changed_when: true
  when: postgresql_image_exists.rc != 0

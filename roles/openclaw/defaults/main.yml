---
openclaw_version: '2026.9.4'
openclaw_image_digest: 'sha256:6bc0bf3117e1c5074db8a064084a5f9d41ece1aa2a16369a82f53207b846a5c3'
openclaw_image: 'ghcr.io/openclaw/openclaw:{{ openclaw_version }}{{ ("@" ~ openclaw_image_digest) if openclaw_image_digest else "" }}'
openclaw_uid: 1000
openclaw_gid: 1000
openclaw_port: 18789
openclaw_hostname: 'claw.{{ infrabox_domain }}'
openclaw_config_dir: '{{ infrabox_config_root }}/openclaw'
openclaw_storage_dir: '{{ infrabox_storage_root }}/openclaw'
openclaw_memory_limit: 2G
openclaw_cpu_limit: 2
openclaw_pids_limit: 512
openclaw_http_proxy: ''
openclaw_https_proxy: ''
openclaw_no_proxy: 'localhost,127.0.0.1,.{{ infrabox_internal_domain }},.{{ infrabox_domain }}'
openclaw_openbao_address: 'https://openbao.{{ infrabox_internal_domain }}:8200'
openclaw_openbao_kv_mount: kv
openclaw_openbao_token_period: 168h
openclaw_openbao_token_renew_calendar: '*-*-* 00,12:00:00'
openclaw_controller_dir: '{{ playbook_dir }}/.secrets/{{ inventory_hostname }}'
openclaw_openbao_socket: /run/infrabox-openbao/api.sock
# Operator-supplied provider definitions must contain SecretRefs, never API keys.
openclaw_model_providers: {}
# Native hosted search on direct OpenAI Responses models; reuse their SecretRef.
openclaw_web_search_enabled: true
openclaw_netbox_enabled: true
openclaw_subnet_scan_enabled: true
openclaw_scanner_image: 'localhost/infrabox-scanner:nmap-7.93-{{ openclaw_image_digest.split(":")[-1][:12] }}'
openclaw_netbox_url: 'https://netbox.{{ infrabox_domain }}'
openclaw_netbox_mcp_version: '0.2.0'
openclaw_netbox_token_file: '{{ openclaw_config_dir }}/secrets/netbox-token'
openclaw_runtime_image: 'localhost/infrabox-openclaw:{{ openclaw_version }}-{{ "netbox-" ~ openclaw_netbox_mcp_version if openclaw_netbox_enabled | bool else "vault-owner" }}-{{ openclaw_image_digest.split(":")[-1][:12] }}'
# Discovery is available when the separately provisioned Platform is enabled.
openclaw_discovery_enabled: '{{ platform_enabled | default(false) | bool }}'
openclaw_discovery_username: svc-openclaw
openclaw_discovery_gitea_url: '{{ platform_gitea_url | default("https://git." ~ infrabox_domain) }}'
openclaw_discovery_organization: '{{ platform_organization | default("infrabox-platform") }}'
openclaw_discovery_repository: '{{ platform_repository | default("automation") }}'
openclaw_discovery_branch: '{{ platform_branch | default("master") }}'
openclaw_discovery_managed_tag: '{{ platform_managed_tag | default("infrabox-managed") }}'

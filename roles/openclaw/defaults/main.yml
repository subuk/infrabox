---
openclaw_version: '2026.9.4'
openclaw_image_digest: 'sha256:6bc0bf3117e1c5074db8a064084a5f9d41ece1aa2a16369a82f53207b846a5c3'
openclaw_image: 'ghcr.io/openclaw/openclaw:{{ openclaw_version }}{{ ("@" ~ openclaw_image_digest) if openclaw_image_digest else "" }}'
openclaw_uid: 1000
openclaw_gid: 1000
openclaw_port: 18789
openclaw_hostname: 'claw.{{ infrabox_domain }}'
openclaw_config_dir: '{{ infrabox_config_root }}/openclaw'
openclaw_storage_dir: '{{ infrabox_storage_root }}/openclaw'
openclaw_memory_limit: 2G
openclaw_cpu_limit: 2
openclaw_pids_limit: 512
openclaw_http_proxy: ''
openclaw_https_proxy: ''
openclaw_no_proxy: 'localhost,127.0.0.1,.{{ infrabox_internal_domain }},.{{ infrabox_domain }}'
openclaw_openbao_address: 'https://openbao.{{ infrabox_internal_domain }}:8200'
openclaw_openbao_kv_mount: kv
openclaw_openbao_token_period: 168h
openclaw_openbao_token_renew_calendar: '*-*-* 00,12:00:00'
openclaw_controller_dir: '{{ playbook_dir }}/.secrets/{{ inventory_hostname }}'
openclaw_openbao_socket: /run/infrabox-openbao/api.sock
# Operator-supplied provider definitions must contain SecretRefs, never API keys.
openclaw_model_providers: {}
openclaw_runtime_image: 'localhost/infrabox-openclaw:{{ openclaw_version }}-vault-owner-{{ openclaw_image_digest.split(":")[-1][:12] }}'

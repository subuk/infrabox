---
- name: Prepare NetBox integration authorization
  ansible.builtin.import_tasks: netbox-prepare.yml
  when: openclaw_netbox_enabled | bool
  tags: [configure]
- name: Install OpenClaw
  ansible.builtin.import_tasks: install.yml
  tags: [install]
- name: Configure OpenClaw
  ansible.builtin.import_tasks: configure.yml
  tags: [configure]
- name: Provision OpenClaw token and renewal
  ansible.builtin.import_tasks: token.yml
  tags: [configure]
- name: Provision NetBox onboarding integration
  ansible.builtin.import_tasks: netbox.yml
  when: openclaw_netbox_enabled | bool
  tags: [configure]
- name: Start OpenClaw
  ansible.builtin.import_tasks: service.yml
  tags: [service]
- name: Verify OpenClaw
  ansible.builtin.import_tasks: verify.yml
  tags: [verify, service]
- name: Retire superseded token only after Gateway verification
  ansible.builtin.include_tasks: bao-manage.yml
  vars:
    openclaw_token_action: finalize
  tags: [service]
- name: Finalize verified NetBox credential replacement
  ansible.builtin.include_tasks: netbox-manage.yml
  vars:
    openclaw_netbox_action: finalize
  when: openclaw_netbox_enabled | bool
  tags: [service]

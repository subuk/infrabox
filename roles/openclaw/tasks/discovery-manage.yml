---
- name: 'Manage dedicated discovery identity and credential: {{ openclaw_discovery_action }}'
  ansible.builtin.command:
    argv: [python3, /usr/local/libexec/infrabox/openclaw-discovery-credential]
    stdin: '{{ openclaw_discovery_parameters | to_json }}'
  vars:
    openclaw_discovery_parameters:
      action: '{{ openclaw_discovery_action }}'
      root_token: '{{ (lookup("ansible.builtin.file", openclaw_controller_dir ~ "/openbao-init.json") | from_json).root_token }}'
      socket: '{{ openclaw_openbao_socket }}'
      mount: '{{ openclaw_openbao_kv_mount }}'
      token_file: '{{ openclaw_config_dir }}/secrets/discovery-token'
      uid: '{{ openclaw_uid }}'
      gid: '{{ openclaw_gid }}'
      url: '{{ openclaw_discovery_gitea_url }}'
      ca: '{{ infrabox_root_ca_path }}'
      username: '{{ openclaw_discovery_username }}'
      organization: '{{ openclaw_discovery_organization }}'
      repository: '{{ openclaw_discovery_repository }}'
      branch: '{{ openclaw_discovery_branch }}'
      admin_user: '{{ gitea_admin_username | default("admin") }}'
      admin_password: '{{ gitea_admin_password }}'
  register: openclaw_discovery_management
  changed_when: openclaw_discovery_management.rc == 0 and (openclaw_discovery_management.stdout | from_json).changed
  failed_when: false
  no_log: true
- name: Require successful discovery credential management
  ansible.builtin.assert:
    that: openclaw_discovery_management.rc == 0
    fail_msg: '{{ openclaw_discovery_management.stderr }}'

---
- name: Apply OpenClaw Quadlet
  ansible.builtin.include_role:
    name: quadlet
    tasks_from: service
  vars:
    quadlet_name: openclaw
    quadlet_type: container
- name: Inspect pending token restart requirement
  ansible.builtin.stat:
    path: '{{ openclaw_config_dir }}/restart-required'
  register: openclaw_restart_required
- name: Schedule Gateway restart for a replaced token
  ansible.builtin.debug:
    msg: OpenClaw token replacement requires a verified Gateway restart.
  changed_when: true
  when: openclaw_restart_required.stat.exists
  notify: Restart openclaw
- name: Apply OpenClaw configuration changes
  ansible.builtin.meta: flush_handlers
- name: Enable periodic token renewal
  ansible.builtin.systemd_service:
    name: openclaw-token-renew.timer
    enabled: true
    state: "{{ 'restarted' if openclaw_renew_units.changed | default(false) else 'started' }}"
    daemon_reload: '{{ openclaw_renew_units.changed | default(false) }}'
- name: Verify native renewal immediately after token replacement
  ansible.builtin.systemd_service:
    name: openclaw-token-renew.service
    state: started
  when: openclaw_restart_required.stat.exists

---
- name: Require pinned image and protected Gateway credential
  ansible.builtin.assert:
    that:
      - openclaw_openbao_token_period is match('^[1-9][0-9]*h$')
      - openclaw_uid | int == 1000
      - openclaw_gid | int == 1000
      - openclaw_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - openclaw_image is search(':' ~ openclaw_version ~ '(@sha256:[a-f0-9]{64})?$')
      - openclaw_gateway_token is defined
      - openclaw_gateway_token | default('') is match('^[a-fA-F0-9]{64,}$')
  no_log: true
- name: Inspect pinned OpenClaw image
  ansible.builtin.command:
    argv: [podman, image, exists, '{{ openclaw_image }}']
  register: openclaw_image_exists
  failed_when: openclaw_image_exists.rc not in [0, 1]
  changed_when: false
- name: Pull pinned OpenClaw image
  ansible.builtin.command:
    argv: [podman, pull, '{{ openclaw_image }}']
  when: openclaw_image_exists.rc == 1
  changed_when: true
- name: Require provider credentials to be scoped Vault SecretRefs
  ansible.builtin.assert:
    that:
      - item.value.apiKey is mapping
      - item.value.apiKey.source == 'exec'
      - item.value.apiKey.provider == 'vault'
      - item.value.apiKey.id is match('^openclaw/')
    fail_msg: Configure model provider API keys as OpenClaw-scoped Vault SecretRefs.
  loop: '{{ openclaw_model_providers | dict2items }}'
  no_log: true
- name: Verify the pinned image release label
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - '{{ openclaw_image }}'
      - --format
      - '{% raw %}{{ index .Config.Labels "org.opencontainers.image.version" }}{% endraw %}'
  register: openclaw_image_version
  changed_when: false
  failed_when: openclaw_image_version.rc != 0 or openclaw_image_version.stdout | trim != openclaw_version
- name: Create private OpenClaw image build directory
  ansible.builtin.file:
    path: '{{ infrabox_config_root }}/openclaw-image'
    state: directory
    owner: root
    group: root
    mode: '0700'
- name: Validate pinned NetBox MCP build inputs and HTTPS endpoint
  ansible.builtin.assert:
    that:
      - openclaw_netbox_url is match('^https://[^/@]+/?$')
      - openclaw_netbox_token_file == openclaw_config_dir ~ '/secrets/netbox-token'
      - (lookup('ansible.builtin.file', role_path ~ '/files/netbox-mcp/package.json') | from_json).dependencies['@zenixsolutions/netbox-mcp'] == openclaw_netbox_mcp_version
  when: openclaw_netbox_enabled | bool
- name: Copy locked NetBox MCP image inputs
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ infrabox_config_root }}/openclaw-image/{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - {src: netbox-mcp/package.json, dest: package.json}
    - {src: netbox-mcp/package-lock.json, dest: package-lock.json}
    - {src: infrabox-netbox-mcp, dest: infrabox-netbox-mcp}
    - {src: verify-netbox-mcp.mjs, dest: verify-netbox-mcp.mjs}
  register: openclaw_mcp_build_inputs
  when: openclaw_netbox_enabled | bool
- name: Copy managed subnet scanner plugin into the image build context
  ansible.builtin.copy:
    src: 'subnet-scan/{{ item }}'
    dest: '{{ infrabox_config_root }}/openclaw-image/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [index.mjs, openclaw.plugin.json]
  register: openclaw_scanner_plugin_inputs
  when: openclaw_subnet_scan_enabled | bool
- name: Copy scanner plugin package metadata
  ansible.builtin.copy:
    src: subnet-scan/package.json
    dest: '{{ infrabox_config_root }}/openclaw-image/scanner-package.json'
    owner: root
    group: root
    mode: '0644'
  register: openclaw_scanner_plugin_package
  when: openclaw_subnet_scan_enabled | bool
- name: Define pinned OpenClaw runtime image
  ansible.builtin.template:
    src: Containerfile.j2
    dest: '{{ infrabox_config_root }}/openclaw-image/Containerfile'
    owner: root
    group: root
    mode: '0600'
  register: openclaw_build_definition
- name: Inspect corrected runtime image
  ansible.builtin.command:
    argv: [podman, image, exists, '{{ openclaw_runtime_image }}']
  register: openclaw_runtime_exists
  failed_when: openclaw_runtime_exists.rc not in [0, 1]
  changed_when: false
- name: Build runtime from pinned image and locked MCP dependencies
  ansible.builtin.command:
    argv:
      - podman
      - build
      - '--network={{ "private" if openclaw_netbox_enabled | bool else "none" }}'
      - --pull=never
      - --tag
      - '{{ openclaw_runtime_image }}'
      - '{{ infrabox_config_root }}/openclaw-image'
  when: openclaw_build_definition.changed or openclaw_mcp_build_inputs.changed | default(false) or openclaw_scanner_plugin_inputs.changed | default(false) or openclaw_scanner_plugin_package.changed | default(false) or openclaw_runtime_exists.rc != 0
  changed_when: true
  notify: Restart openclaw

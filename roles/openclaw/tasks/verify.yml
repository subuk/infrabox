---
- name: Verify Gateway liveness through the loopback host publication
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ openclaw_port }}/healthz'
  register: openclaw_health
  until: openclaw_health.status == 200
  retries: 60
  delay: 3
- name: Verify Gateway readiness directly inside the container
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - openclaw
      - node
      - -e
      - 'fetch("http://127.0.0.1:{{ openclaw_port }}/readyz").then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))'
  register: openclaw_ready
  changed_when: false
  until: openclaw_ready.rc == 0
  retries: 60
  delay: 3
- name: Verify OpenClaw isolation, token contract, and Node trust
  ansible.builtin.script:
    cmd: 'scripts/verify-openclaw.py {{ openclaw_port }} {{ openclaw_config_dir }} {{ openclaw_storage_dir }} {{ infrabox_root_ca_path }} {{ (openclaw_openbao_token_period | regex_replace("h$", "") | int) * 3600 }}'
  changed_when: false
- name: Audit configured provider SecretRefs through OpenClaw security checks
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, openclaw.mjs, secrets, audit, --check, --allow-exec, --json]
  changed_when: false
  no_log: true
- name: Verify native OpenAI web search payload and tool policy without inference
  ansible.builtin.command:
    argv: [podman, exec, -i, openclaw, node, --input-type=module, '-']
    stdin: '{{ lookup("ansible.builtin.file", playbook_dir ~ "/scripts/verify-openclaw-web-search.mjs") }}'
  changed_when: false
  when: openclaw_web_search_enabled | bool
- name: Verify bounded scanner isolation and transport without scanning
  ansible.builtin.script:
    cmd: scripts/verify-subnet-scanner.py
  changed_when: false
  when: openclaw_subnet_scan_enabled | bool
- name: Verify OpenBao and NetBox credential identity without changing inventory
  ansible.builtin.include_tasks: netbox-manage.yml
  vars:
    openclaw_netbox_action: verify
  when: openclaw_netbox_enabled | bool
- name: Verify pinned MCP tools and an actual NetBox read through stdio
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, /opt/infrabox/verify-netbox-mcp.mjs, '{{ openclaw_netbox_mcp_version }}']
  register: openclaw_mcp_session
  changed_when: false
  until: openclaw_mcp_session.rc == 0
  retries: 2
  delay: 5
  when: openclaw_netbox_enabled | bool
- name: Probe the configured server through OpenClaw's own MCP client
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, openclaw.mjs, mcp, probe, netbox, --json]
  register: openclaw_netbox_probe
  changed_when: false
  when: openclaw_netbox_enabled | bool
- name: Require the five tools from OpenClaw's MCP probe
  ansible.builtin.assert:
    that:
      - (openclaw_netbox_probe.stdout | from_json).servers.netbox.tools == 5
      - (openclaw_netbox_probe.stdout | from_json).diagnostics | length == 0
  when: openclaw_netbox_enabled | bool

- name: Read native plugin tool registrations without inference
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, openclaw.mjs, plugins, list, --json]
  register: openclaw_registered_plugins
  changed_when: false
- name: Require registered read-only health tool
  ansible.builtin.assert:
    that:
      - "'infrabox_health' in ((openclaw_registered_plugins.stdout | from_json).plugins | selectattr('id', 'equalto', 'infrabox-health') | first).toolNames"

- name: Verify discovery identity and runtime credential without dispatch
  ansible.builtin.include_tasks: discovery-manage.yml
  vars:
    openclaw_discovery_action: verify
  when: openclaw_discovery_enabled | bool
- name: Verify actual Gateway-side Gitea HTTPS and fixed workflow access
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, /opt/infrabox/plugins/discovery/verify.mjs]
  changed_when: false
  when: openclaw_discovery_enabled | bool
- name: Require registered discovery tools
  ansible.builtin.assert:
    that:
      - "((openclaw_registered_plugins.stdout | from_json).plugins | selectattr('id', 'equalto', 'infrabox-discovery') | first).toolNames | sort == ['infrabox_discovery_result', 'infrabox_discovery_start', 'infrabox_discovery_status']"
  when: openclaw_discovery_enabled | bool
- name: Inspect actual discovery plugin runtime registrations without inference
  ansible.builtin.command:
    argv: [podman, exec, openclaw, node, openclaw.mjs, plugins, inspect, infrabox-discovery, --runtime, --json]
  register: openclaw_discovery_runtime
  changed_when: false
  when: openclaw_discovery_enabled | bool
- name: Require discovery runtime to expose only the three optional tools
  ansible.builtin.assert:
    that:
      - "((openclaw_discovery_runtime.stdout | from_json).tools | map(attribute='names') | flatten | sort) == ['infrabox_discovery_result', 'infrabox_discovery_start', 'infrabox_discovery_status']"
      - "(openclaw_discovery_runtime.stdout | from_json).tools | rejectattr('optional', 'equalto', true) | list | length == 0"
  when: openclaw_discovery_enabled | bool

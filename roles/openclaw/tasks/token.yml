---
- name: Ensure OpenClaw OpenBao policy and role
  ansible.builtin.import_tasks: bao-configure.yml
- name: Preserve or replace OpenClaw service token
  ansible.builtin.include_tasks: bao-manage.yml
  vars:
    openclaw_token_action: provision
- name: Enforce private service token access
  ansible.builtin.file:
    path: '{{ openclaw_config_dir }}/secrets/vault-token'
    owner: '{{ openclaw_uid }}'
    group: '{{ openclaw_gid }}'
    mode: '0600'
- name: Install renewal helper
  ansible.builtin.template:
    src: openclaw-token-renew.j2
    dest: /usr/local/libexec/infrabox/openclaw-token-renew
    owner: root
    group: root
    mode: '0700'
- name: Install renewal service and timer
  ansible.builtin.template:
    src: 'openclaw-token-renew.{{ item }}.j2'
    dest: '/etc/systemd/system/openclaw-token-renew.{{ item }}'
    mode: '0644'
  loop: [service, timer]
  register: openclaw_renew_units

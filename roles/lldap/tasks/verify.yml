---
- name: Verify LLDAP native health checks
  ansible.builtin.command:
    argv: [podman, exec, lldap, /app/lldap, healthcheck, --config-file, /etc/lldap/lldap.toml]
  changed_when: false
  no_log: true
- name: Verify LLDAP connections to PostgreSQL use TLS
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --user
      - postgres
      - postgresql
      - psql
      - -XAt
      - -U
      - postgres
      - -c
      - "SELECT count(*) > 0 AND bool_and(s.ssl) FROM pg_stat_activity a JOIN pg_stat_ssl s USING(pid) WHERE a.usename='lldap' AND a.datname='lldap'"
  register: lldap_database_tls
  changed_when: false
  failed_when: lldap_database_tls.rc != 0 or lldap_database_tls.stdout | trim != 't'
- name: Verify actual LDAPS handshake and hostname
  ansible.builtin.command:
    argv:
      - openssl
      - s_client
      - -connect
      - '127.0.0.1:{{ lldap_management_ldaps_port }}'
      - -servername
      - 'lldap.{{ infrabox_internal_domain }}'
      - -verify_hostname
      - 'lldap.{{ infrabox_internal_domain }}'
      - -verify_return_error
      - -CAfile
      - '{{ infrabox_root_ca_path }}'
    stdin: ''
  changed_when: false

---
- name: Install public RootCA in host trust anchors
  ansible.builtin.copy:
    src: '{{ cacerts_root_ca_source }}'
    dest: /etc/pki/ca-trust/source/anchors/infrabox-root-ca.crt
    remote_src: true
    mode: '0644'
  register: cacerts_anchor
- name: Update host trust store
  ansible.builtin.command: update-ca-trust extract
  changed_when: true
  when: cacerts_anchor.changed

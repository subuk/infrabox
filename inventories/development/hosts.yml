---
all:
  children:
    infrabox:
      hosts:
        infrabox1:
          ansible_host: 192.168.32.206
          ansible_user: almalinux
          openclaw_model_providers:
            openai:
              baseUrl: https://api.openai.com/v1
              api: openai-responses
              models:
                - id: gpt-5.6-sol
                  name: GPT-5.6 Sol
                - id: gpt-5.6-terra
                  name: GPT-5.6 Terra
                - id: gpt-5.6-luna
                  name: GPT-5.6 Luna
                - id: gpt-6-astra
                  name: GPT-6 Astra
              apiKey:
                source: exec
                provider: vault
                id: openclaw/providers/openai/apiKey
            ollama:
              baseUrl: http://192.168.32.38:11434
              api: ollama
              apiKey: ollama-local # Non-secret marker; LAN Ollama requires no key.
              models:
                - id: qwen3.5:9b
                  name: Qwen 3.5 9B
                  reasoning: true
                  input: [text, image]
                  contextWindow: 262144
                  maxTokens: 8192
          openclaw_no_proxy: 'localhost,127.0.0.1,.{{ infrabox_internal_domain }},.{{ infrabox_domain }},192.168.32.38'
